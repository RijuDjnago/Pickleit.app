<div class="col-md-6 col-lg-6 mb-4">
<div class="advertisement-container">
    <a href="#" class="ad-link" style="text-decoration: none; color: inherit; display: block;">
        <div class="card nw-card shadow-sm mb-0" style="cursor: pointer; background: linear-gradient(135deg, #2a2a72, #009ffd); overflow: hidden; position: relative;">
            <div class="card-body p-0 d-flex flex-column align-items-center justify-content-center" style="position: relative; height: 100%;">
                <!-- Full-width Background Image with Overlay -->
                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; background-image: url('https://via.placeholder.com/300x150'); opacity: 0.5;"></div>
                <!-- Text Content -->
                <div class="d-flex flex-column align-items-center justify-content-center text-center flex-grow-1" style="padding: 15px; position: relative; z-index: 1;">
                    <span class="badge bg-warning text-dark" style="position: absolute; top: 10px; right: 10px; z-index: 2;">Sponsored</span>
                    <h5 class="ad-title mb-1 text-white" style="font-size: 1.25rem; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">Loading...</h5>
                    <p class="ad-description text-white small mb-0" style="font-size: 0.875rem; max-width: 80%;">Check out our amazing products!</p>
                    <button class="btn btn-sm btn-light mt-2" style="font-size: 0.75rem; padding: 5px 10px;">Learn More</button>
                </div>
            </div>
        </div>
    </a>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        const apiUrl = "/user_side/advertisements/";
        console.log("Fetching advertisement data from:", apiUrl);
        
        $('.advertisement-container').each(function() {
            const $container = $(this);
            $.ajax({
                url: apiUrl,
                method: 'GET',
                dataType: 'json',
                success: function(ad) {
                    $container.find('.ad-link').attr('href', ad.url || 'https://example.com');
                    $container.find('.card-body > div:first-child').css('background-image', `url(${ad.image_url || 'https://via.placeholder.com/300x150'})`);
                    $container.find('.ad-title').text(ad.company_name || 'Fallback Brand');
                    $container.find('.ad-description').text(ad.script_text || 'Check out our amazing products!');
                },
                error: function(xhr, status, error) {
                    console.error('Error fetching advertisement data:', error);
                    $container.find('.ad-link').attr('href', 'https://example.com');
                    $container.find('.card-body > div:first-child').css('background-image', 'ur[](https://via.placeholder.com/300x150)');
                    $container.find('.ad-title').text('Fallback Brand');
                    $container.find('.ad-description').text('Check out our amazing products!');
                }
            });
        });

        // Hover effect for advertisement card
        $('.advertisement-container .card').hover(
            function() {
                $(this).css('transform', 'scale(1.02)');
                $(this).css('box-shadow', '0 8px 16px rgba(0,0,0,0.2)');
            },
            function() {
                $(this).css('transform', 'scale(1)');
                $(this).css('box-shadow', '0 4px 8px rgba(0,0,0,0.1)');
            }
        );
    });
</script>
