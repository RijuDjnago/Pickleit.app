{% load custom_filters %}
<div class="container-fluid py-5" style="width: 100%;">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h5 class="card-title mb-0" style="font-size: 1.5rem; font-weight: 600; color: #333;">Events</h5>
        <a href="{%url 'user_side:event_user' %}" class="btn btn-primary btn-sm" style="font-weight: 500; padding: 8px 16px;">View All</a>
    </div>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for item in event_list %}
        <div class="col">
            <div class="card h-100" style="position: relative; border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
                <div class="bottom-right" style="position: absolute; bottom: 8px; right: 16px; color: #000; font-size: 10px; font-weight: 500; z-index: 999;">{{ item.date|date:"d/m/Y" }}</div>
                <div class="top-right" style="position: absolute; top: 16px; right: 16px; z-index: 999;">
                    <div class="tags-list mb-2" style="display: flex; gap: 5px;">
                        <span class="tags-list-town text-uppercase" style="background-color: #9c27b0; color: #fff; font-size: 12px; padding: 4px 6px; border-radius: 2px; font-weight: 600;" data-bs-toggle="tooltip" data-bs-trigger="click" title="{{ item.city }}"><i class="fa-solid fa-map-marker-alt"></i></span>
                        <span style="background-color: #28a745; color: #fff; font-size: 12px; padding: 4px 6px; border-radius: 2px; font-weight: 800; text-transform: uppercase;" data-bs-toggle="tooltip" data-bs-trigger="click" title="$ {{ item.price }}"><i class="fa-solid fa-dollar-sign"></i></span>
                    </div>
                </div>
                <div class="image-container" style="position: relative; overflow: hidden;">
                    <div class="bottom-left" style="position: absolute; bottom: 14px; left: 16px; z-index: 999;">
                        <div class="thumbnail" style="background-color: {{ item.thumbnail_color }}; border-radius: 3px; height: 52px; width: 52px; text-align: center; box-shadow: 0.5rem 0.5rem #00000085, -0.5rem -0.5rem #cccccca3;">
                            <div class="thumbnail-date" style="line-height: 1;">
                                <span class="thumbnail-date-day" style="display: block; font-size: 24px; font-weight: 700; color: #fff; margin-top: 4px;">{{ item.date|date:"d" }}</span>
                                <span class="thumbnail-date-month" style="display: block; font-size: 10px; color: #fff; text-transform: uppercase;">{{ item.date|date:"M" }}</span>
                            </div>
                        </div>
                    </div>
                    <a href="{% url 'user_side:event_view' item.id %}" style="text-decoration: none;">
                        <img src="{{ item.image_url }}" class="card-img-top" alt="{{ item.title }}" style="border-radius: 8px 8px 0 0; object-fit: cover; height: 200px; width: 100%;" />
                    </a>
                    <div class="image-overlay text-over text-center d-flex justify-content-center align-items-center text-uppercase" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.57); color: #fff; font-size: 1.2rem; font-weight: 900; padding: 20px;">
                        <div>{{ item.title }}</div>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
            {% include 'base/not_found.html' %}
        {% endfor %}
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Initialize Bootstrap tooltips
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
    });
</script>
